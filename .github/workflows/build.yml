name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="luci-theme-midnight_${VERSION}-r0_all"

          mkdir -p staging/www/luci-static/midnight

          install -m 644 src/luci-static/midnight/cascade.css \
                         staging/www/luci-static/midnight/cascade.css

          INSTALLED_SIZE=$(du -sb staging | awk '{print $1}')
          BUILDDATE=$(date +%s)

          cat > staging/.PKGINFO << EOF
          pkgname = luci-theme-midnight
          pkgver = ${VERSION}-r0
          arch = all
          size = ${INSTALLED_SIZE}
          pkgdesc = Midnight dark theme for LuCI (OpenWrt web interface)
          url = https://github.com/${GITHUB_REPOSITORY}
          builddate = ${BUILDDATE}
          packager = Matt Bird
          depend = luci-base
          EOF

          cat > staging/.post-install << 'SCRIPT'
          #!/bin/sh
          uci -q get luci.themes > /dev/null 2>&1 || uci -q set luci.themes=internal
          uci -q set luci.themes.Midnight='/luci-static/midnight'
          uci -q set luci.main.mediaurlbase=/luci-static/midnight
          uci -q commit luci
          SCRIPT

          cat > staging/.pre-deinstall << 'SCRIPT'
          #!/bin/sh
          uci -q del luci.themes.Midnight 2>/dev/null || true
          uci -q set luci.main.mediaurlbase=/luci-static/bootstrap
          uci -q commit luci
          SCRIPT

          chmod 755 staging/.post-install staging/.pre-deinstall

          tar -czf "${PKG}.apk" \
            --owner=0 --group=0 \
            -C staging \
            .PKGINFO .post-install .pre-deinstall \
            ./www

          echo "APK_FILE=${PKG}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}"  >> $GITHUB_ENV

      - name: Embed CSS in install.sh
        run: |
          CSS_B64=$(base64 -w0 src/luci-static/midnight/cascade.css)

          # Replace the CSS_B64= line (and everything after) with fresh content
          head -n $(grep -n '^CSS_B64=' install.sh | cut -d: -f1 | head -1) install.sh \
            | head -n -1 > install.sh.new || cp install.sh install.sh.new
          printf 'CSS_B64="%s"\n' "$CSS_B64" >> install.sh.new
          mv install.sh.new install.sh
          chmod +x install.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_FILE }}
            install.sh
          body: |
            ## LuCI Midnight Theme v${{ env.VERSION }}

            ### Install options

            **Option 1 — install.sh (recommended):**
            Replace `192.168.1.1` with your router's actual IP address.
            ```sh
            curl -sL https://github.com/${{ github.repository }}/releases/latest/download/install.sh \
              -o install.sh && chmod +x install.sh && ./install.sh root@192.168.1.1
            ```

            **Option 2 — apk package (OpenWrt 24.10+):**
            ```sh
            curl -sLO https://github.com/${{ github.repository }}/releases/latest/download/${{ env.APK_FILE }}
            apk add --allow-untrusted ${{ env.APK_FILE }}
            ```

            **Revert to default theme:**
            ```sh
            uci set luci.main.mediaurlbase=/luci-static/bootstrap && uci commit luci
            ```

            ### Requirements
            - OpenWrt 24.10+ (apk); earlier versions via install.sh
            - `luci-base` (installed by default with LuCI)
